<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gray-100 p-4 font-sans">
    <main class="w-full max-w-sm bg-white p-8 rounded-xl shadow-md">
      <h1 class="text-2xl font-semibold mb-5">Log in</h1>
      <form id="login-form" novalidate class="flex flex-col gap-3">
        <label class="flex flex-col gap-1 text-sm text-gray-700">
          Email
          <input type="email" name="email" autocomplete="email" required
            class="px-3 py-2 border border-gray-300 rounded-md text-base focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
        </label>
        <label class="flex flex-col gap-1 text-sm text-gray-700">
          Password
          <input type="password" name="password" autocomplete="current-password" required minlength="8"
            class="px-3 py-2 border border-gray-300 rounded-md text-base focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />
        </label>
        <button type="submit"
          class="mt-2 py-2.5 rounded-md bg-blue-500 text-white text-base hover:bg-blue-600 disabled:bg-gray-400 disabled:cursor-not-allowed cursor-pointer">
          Log in
        </button>
        <p id="auth-message" role="alert" class="min-h-5 text-sm text-red-700 m-0 data-[ok=true]:text-emerald-700"></p>
      </form>
      <p class="mt-4 text-center text-sm">
        No account? <a href="./signup.html" class="text-blue-600 hover:underline">Sign up</a>
      </p>
      <p class="mt-2 text-center text-sm">
        <a href="../index.html" class="text-blue-600 hover:underline">Back to home</a>
      </p>
    </main>
    <script src="../js/auth.js"></script>
    <script>
      initAuthForm("login-form", "/api/login");
    </script>
  </body>
</html>
